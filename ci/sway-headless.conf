# Minimal sway config for headless CI: one 1920x1080 output, no Xwayland, no bars.
xwayland disable
output HEADLESS-1 resolution 1920x1080 position 0 0
# A solid background (drawn by swaybg) that the screenshot tests look for.
output * bg #2f6d8c solid_color
default_border normal
focus_follows_mouse no
# An outer gap keeps a strip of that background visible around tiled windows, whatever other tests have open.
gaps inner 0
gaps outer 24
