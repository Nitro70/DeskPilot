name: linux

on:
  push:
    branches: [ main, 'linux-ci/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.session }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        session: [ x11, wayland ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install desktop test environment
        run: |
          sudo apt-get update -qq
          # Every module lists its packages in ci/apt/<module>.txt.
          sudo apt-get install -y -qq --no-install-recommends $(cat ci/apt/*.txt | sed 's/#.*//' | xargs)
          for f in ci/setup.d/*.sh; do sudo bash "$f"; done

      - name: Build
        run: dotnet build tests/DeskPilot.Linux.Tests -c Release

      - name: Test (${{ matrix.session }})
        run: bash ci/run-linux-tests.sh ${{ matrix.session }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results-${{ matrix.session }}
          path: |
            **/TestResults/**
            ci-logs/**
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, linux-arm64 ]
    env:
      # Pinned AppImage tooling from the official AppImage releases, checked against these digests.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging tools
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils file shellcheck xvfb xauth x11-utils

      - name: Lint packaging scripts
        if: matrix.rid == 'linux-x64'
        run: shellcheck packaging/linux/*.sh

      - name: Download appimagetool
        if: matrix.rid == 'linux-x64'
        run: |
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tools/appimagetool" "$APPIMAGE_RUNTIME_SHA256" "$tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/appimagetool"
          echo "APPIMAGETOOL=$tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$tools/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Publish and package
        run: bash packaging/linux/build-package.sh ${{ matrix.rid }}

      - name: Check the packages
        if: matrix.rid == 'linux-x64'
        run: bash packaging/linux/check-package.sh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPilot-${{ matrix.rid }}
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
