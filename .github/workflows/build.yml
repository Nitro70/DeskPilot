name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DeskPilot.sln -c Release

      - name: Test
        run: dotnet test tests/DeskPilot.Tests -c Release --no-build

      - name: Publish single-file exe
        run: dotnet publish src/DeskPilot/DeskPilot.csproj -c Release -r win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPilot-win-x64
          path: bin/publish/DeskPilot.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/publish/DeskPilot.exe
